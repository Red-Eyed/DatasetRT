name: Feature request
description: Describe a dataset workflow that DatasetRT could support better.
body:
  - type: textarea
    id: problem
    attributes:
      label: Workflow and problem
      description: What are you trying to do, and what prevents it today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior and alternatives
      description: Include scale, storage, sampling, or compatibility requirements where relevant.
    validations:
      required: true
