name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  coverage:
    name: Rust and Python coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync dependencies
        run: uv sync --python 3.11 --extra dev --locked
      - name: Collect Rust and Python coverage
        shell: bash
        run: |
          cargo llvm-cov show-env --sh > "${RUNNER_TEMP}/coverage-env.sh"
          # shellcheck source=/dev/null
          source "${RUNNER_TEMP}/coverage-env.sh"
          cargo llvm-cov clean --workspace
          cargo test --locked
          uv run --python 3.11 --extra dev maturin develop
          uv run --python 3.11 --extra dev pytest -n 2 --cov --cov-report=term-missing --cov-report=xml:coverage-python.xml
          cargo llvm-cov report --lcov --output-path coverage-rust.lcov
      - name: Save coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            coverage-python.xml
            coverage-rust.lcov
          if-no-files-found: error
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          use_oidc: true
          files: coverage-python.xml,coverage-rust.lcov
          disable_search: true
          fail_ci_if_error: true

  checks:
    name: Python 3.11 and Rust stable
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Sync dependencies
        run: uv sync --python 3.11 --extra dev

      - name: Rust tests
        run: cargo test

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build editable extension
        run: uv run --python 3.11 --extra dev maturin develop

      - name: Ruff format
        run: uv run --python 3.11 --extra dev ruff format --check dataset_rt tests scripts

      - name: Ruff lint
        run: uv run --python 3.11 --extra dev ruff check dataset_rt tests scripts

      - name: Precise type policy
        run: uv run --python 3.11 --extra dev scripts/check_precise_types.py

      - name: Pyrefly
        run: uv run --python 3.11 --extra dev pyrefly check

      - name: Generated API documentation
        run: uv run --python 3.11 --extra dev scripts/sync_api_docs.py --check

      - name: Build standard wheel once
        run: uv run --python 3.11 --extra dev maturin build --release --out wheelhouse --interpreter .venv/bin/python

      - name: Save standard wheel
        uses: actions/upload-artifact@v4
        with:
          name: standard-wheel
          path: wheelhouse/*.whl

  wheel-tests:
    name: Installed wheel / Python ${{ matrix.python }}
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13', '3.14', '3.15']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/download-artifact@v4
        with:
          name: standard-wheel
          path: wheelhouse
      - uses: actions/setup-python@v6
        with:
          python-version: '${{ matrix.python }}'
      - name: Create isolated interpreter
        run: uv venv --python '${{ matrix.python }}' --seed /tmp/wheel-env
      - name: Install wheel and published binary dependencies
        run: >-
          uv pip install --python /tmp/wheel-env/bin/python --only-binary=:all: wheelhouse/*.whl pytest pytest-xdist pydantic-settings pyrefly torch psutil
      - name: Test installed wheel outside checkout
        run: uv run --no-project --python /tmp/wheel-env/bin/python scripts/test_wheel.py
