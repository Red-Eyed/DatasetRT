[package]
name = "dataset_rt"
version = "0.1.5"
edition = "2021"
description = "Framework-independent dataset cache runtime"
license = "MIT"
documentation = "https://github.com/Red-Eyed/DatasetRT/tree/main/docs"
homepage = "https://github.com/Red-Eyed/DatasetRT"
repository = "https://github.com/Red-Eyed/DatasetRT"

[lib]
name = "_dataset_rt"
path = "src/dataset_rt/lib.rs"
crate-type = ["cdylib"]

[dependencies]
arrow-array = "54"
arrow-ipc = "54"
arrow-schema = "54"
crossbeam-channel = "0.5"
hex = "0.4"
indicatif = "0.18"
lz4_flex = "0.14"
pyo3 = { version = "0.29", features = ["abi3-py310", "extension-module"] }
rand = "0.8"
rand_chacha = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "1"
