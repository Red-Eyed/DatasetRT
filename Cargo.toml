[package]
name = "dataset_rt"
version = "0.5.1"
edition = "2021"
description = "Rust-powered dataset cache for Python with fast sample reads and separate metadata for analysis, filtering, and weighted sampling"
license = "MIT"
documentation = "https://red-eyed.github.io/DatasetRT/"
homepage = "https://github.com/Red-Eyed/DatasetRT"
repository = "https://github.com/Red-Eyed/DatasetRT"

[lib]
name = "_dataset_rt"
path = "src/dataset_rt/lib.rs"
crate-type = ["cdylib"]

[dependencies]
arrow-array = { version = "54", features = ["ffi"] }
arrow-ipc = "54"
arrow-buffer = "54"
arrow-schema = "54"
arrow-select = "54"
hex = "0.4"
indicatif = "0.18"
lz4_flex = "0.14"
memmap2 = "0.9"
pyo3 = { version = "0.29", features = ["abi3-py310", "extension-module"] }
rand = "0.8"
rand_chacha = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "1"
lz4 = "1.28.1"
brotli = { version = "9.1.1", features = ["portable-float", "disallow_large_window_size"] }

[profile.release]
# Preserve Mach-O LINKEDIT alignment: https://github.com/rust-lang/rust/issues/157750
strip = "none"
