site_name: DatasetRT
site_description: Rust-powered dataset cache for Python with fast sample reads and separate metadata for analysis, filtering, and weighted sampling.
site_url: https://red-eyed.github.io/DatasetRT/
repo_url: https://github.com/Red-Eyed/DatasetRT
repo_name: DatasetRT on GitHub
edit_uri: ""
site_dir: site
strict: true

exclude_docs: |
  /architecture.md
  /runtime.md
  /inversion-analysis.md
  /inversion-checklists.md
  /fork-reproducer.md
  /development.md
  /build.md
  /discoverability.md

theme:
  name: readthedocs
  custom_dir: docs_overrides
  highlightjs: false
  collapse_navigation: false
  navigation_depth: 2
  titles_only: true

plugins:
  - search

markdown_extensions:
  - tables
  - fenced_code
  - toc:
      permalink: true

validation:
  nav:
    omitted_files: warn
  links:
    not_found: warn
    anchors: warn
    unrecognized_links: warn

nav:
  - Getting started:
      - Overview and installation: index.md
      - Quickstart — cache your first dataset: cache-training-data.md
  - User guides:
      - Serialize Python records: serialization.md
      - Analyze, filter, and weight samples: polars-sampling.md
      - Load batches with PyTorch: pytorch-dataloader.md
  - Concepts:
      - Runtime, workers, and shared memory: runtime-guide.md
      - Sampling and reproducibility: determinism.md
      - Architecture: overview.md
  - API reference:
      - Python API: python-api.md
      - Cache storage format: storage-format.md
  - Benchmarks:
      - Reader measurements: benchmarks.md
      - Run your own benchmarks: remote-validation.md
      - Compare dataset tools: comparisons.md
