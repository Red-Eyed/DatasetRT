[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "dataset-rt"
description = "Python dataset caching for machine learning, powered by Rust, with deterministic weighted sampling"
keywords = ["dataset", "cache", "machine-learning", "sampling", "rust", "polars"]
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["version"]
authors = [
    { name = "Vadym Stupakov", email = "vadim.stupakov@gmail.com" },
]
license = "MIT"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "pydantic>=2",
    "polars>=1",
    "pyarrow>=19",
    "numpy>=1.26",
]

[project.urls]
Homepage = "https://github.com/Red-Eyed/DatasetRT"
Documentation = "https://red-eyed.github.io/DatasetRT/"
Repository = "https://github.com/Red-Eyed/DatasetRT"
Issues = "https://github.com/Red-Eyed/DatasetRT/issues"
Changelog = "https://github.com/Red-Eyed/DatasetRT/blob/main/CHANGELOG.md"

[project.optional-dependencies]
benchmark = [
    "pydantic-settings>=2",
    "torch>=2.14.1",
    "psutil>=7.2.2",
]
dev = [
    "maturin[zig]>=1.7,<2",
    "pytest>=8",
    "pytest-xdist>=3.8",
    "ruff>=0.16.9",
    "pyrefly>=1.3.1",
    "pydantic-settings>=2",
    "torch>=2.14.1",
    "psutil>=7.2.2",
    "types-psutil>=7.2.2",
]

[dependency-groups]
docs = ["mkdocs>=1.6,<2"]

[tool.maturin]
module-name = "dataset_rt._dataset_rt"
python-source = "."
features = ["pyo3/extension-module"]

[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "Cargo.lock" },
    { file = "src/**/*.rs" },
]
