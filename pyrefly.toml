required-version = ">=1.3.1"
python-version = "3.11"
preset = "strict"
project-includes = ["dataset_rt/**/*.py", "dataset_rt/**/*.pyi", "tests/**/*.py", "scripts/**/*.py"]
project-excludes = ["build/**"]

# Missing dependencies must remain visible instead of becoming Any.
ignore-missing-imports = []
replace-imports-with-any = []
replace-untyped-imports-with-any = []
check-unannotated-defs = true
strict-callable-subtyping = true
strict-partial-subtyping = true

# A suppression written for another checker must not hide unrelated errors.
permissive-ignores = false
type-ignore-unknown-tag-behavior = "no-effect"

[errors]
explicit-any = "error"
implicit-any = "error"
no-any-return = "error"
unannotated-return = "error"
unannotated-parameter = "error"
unannotated-protocol-member = "error"
unused-ignore = "error"
redundant-cast = "error"
redundant-condition = "error"
incompatible-comparison = "error"
string-as-iterable = "error"
empty-body = "error"
